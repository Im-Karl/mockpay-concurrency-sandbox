# Java 21+ Virtual Threads Activation
spring.threads.virtual.enabled=true

# PostgreSQL Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/mockpay_db
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema & Data Initialization
spring.sql.init.mode=always

# HikariCP Connection Pool Configurations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Hibernate JPA Properties (ddl-auto set to none to let schema.sql manage the DB structure)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configurations
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Actuator & Prometheus Metrics Monitoring Endpoint
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
server.port=8080
