name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Spring Boot core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-pay-workspace/transaction-core-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & test
        run: mvn -B -ntp verify

  gateway:
    name: NestJS gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-pay-workspace/gateway-worker-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mock-pay-workspace/gateway-worker-service/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: mock-pay-workspace
        run: docker compose config -q
